[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdist2tag"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Toshihiro Kamiya", email = "kamiya@mbj.nifty.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
sdist2tag = "sdist2tag.cli:main"

[project.urls]
Documentation = "https://github.com/Toshihiro Kamiya/sdist2tag#readme"
Issues = "https://github.com/Toshihiro Kamiya/sdist2tag/issues"
Source = "https://github.com/Toshihiro Kamiya/sdist2tag"

[tool.hatch.version]
path = "src/sdist2tag/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/sdist2tag tests}"

[tool.coverage.run]
source_pkgs = ["sdist2tag", "tests"]
branch = true
parallel = true
omit = [
  "src/sdist2tag/__about__.py",
]

[tool.coverage.paths]
sdist2tag = ["src/sdist2tag", "*/sdist2tag/src/sdist2tag"]
tests = ["tests", "*/sdist2tag/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
